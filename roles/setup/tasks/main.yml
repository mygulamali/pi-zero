---
- name: Update package list
  command: apt update

- name: Install necessary packages
  command: >
    apt install -y
    aptitude
    git
    mosh
    openssh-server
    python3
    python3-apt
    python3-pexpect
    python3-pip

- name: Setup SSH directory
  file:
    path: /home/{{ ansible_user }}/.ssh
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: 0700

- name: Allow SSH public key
  copy:
    src: "{{ ssh_public_key }}"
    dest: /home/{{ ansible_user }}/.ssh/authorized_keys
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: 0655

- name: Disable HDMI via firmware config
  lineinfile:
    path: /boot/firmware/config.txt
    regexp: "^hdmi_blanking="
    line: "hdmi_blanking=1"
    state: present

- name: Disable HDMI port detection
  lineinfile:
    path: /boot/firmware/config.txt
    regexp: "^hdmi_ignore_hotplug="
    line: "hdmi_ignore_hotplug=1"
    state: present
